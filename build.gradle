plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('group') ?: 'dev.cmp'

base {
    archivesName = 'create-mechanical-principles'
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def localCompile = providers.gradleProperty('cmpLocal').isPresent()

if (localCompile) {
    // Offline compile harness for machines where the NeoForge Maven is not
    // reachable. libs/compile is generated from the local NeoForge 21.1.262
    // installation and is intentionally not part of the repository.
    dependencies {
        compileOnly fileTree(dir: 'libs/compile', include: ['*.jar'])
    }
} else {
    apply plugin: 'net.neoforged.moddev'

    neoForge {
        version = project.findProperty('neo_version') ?: '21.1.262'

        runs {
            client {
                client()
            }
            server {
                server()
            }
        }

        mods {
            create_mechanical_principles {
                sourceSet sourceSets.main
            }
        }
    }

    dependencies {
        implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") {
            transitive = false
        }
        implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
        compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
        runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
        implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'Create: Mechanical Principles',
                'Implementation-Version': project.version,
                'MixinConfigs': 'create_mechanical_principles.mixins.json'
        )
    }
}
